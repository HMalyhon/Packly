# Backing and application services for Packly.
#
# Every value has a working default, so a fresh clone runs with `docker compose up`
# and no setup. Copy .env.example to .env to override anything.

name: packly

services:

  # Message broker. The management UI on :15672 shows exchanges, queues and
  # message rates while the flow runs.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: packly-rabbitmq
    # RabbitMQ names its data directory after the host name. Without pinning it, a
    # recreated container comes up with a new random name and silently abandons the
    # durable queues sitting in the volume.
    hostname: packly-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-packly}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-packly}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Write side: the order aggregate, the MassTransit outbox, and saga state.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # The only image here that ships amd64 alone; every other one has an arm64
    # build. Stated rather than left to chance, because without it an Apple
    # Silicon host fails as two services waiting forever on service_healthy
    # rather than as anything that names the cause.
    platform: linux/amd64
    container_name: packly-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Packly!Local1}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # $$ escapes to a literal $ so the shell inside the container expands the
      # variable, not Compose. -C trusts the self-signed certificate, which
      # mssql-tools18 requires and which is fine for a local container.
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Read side: the denormalised projection the API serves queries from.
  #
  # Pinned to 7 deliberately. mongo:8 segfaults within a minute of starting on
  # some hosts - reproduced standalone, with no auth, volume or health check, so
  # it is the image rather than anything here. Nothing in the read model needs 8.
  mongo:
    image: mongo:7
    container_name: packly-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-packly}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-packly}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Where traces land. Every service exports to it and nothing depends on it: with
  # the collector down the exporter fails quietly and orders still flow, so it
  # gates no health check. In-memory and unvolumed - traces last as long as the
  # container, which is what watching a run needs. Pinned exactly because Jaeger
  # publishes no major-only tag; 2.x speaks OTLP natively, so there is nothing to
  # configure.
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: packly-jaeger
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"

  # Both sides of the split: accepts orders into SQL Server, answers queries
  # from MongoDB.
  api:
    build:
      # Root context, because the build needs Directory.Build.props and the
      # analyzer configuration that live there.
      context: .
      dockerfile: src/Packly.Api/Dockerfile
    container_name: packly-api
    environment:
      # Double underscore is the .NET convention for nesting in environment
      # variables: this overrides ConnectionStrings:OrdersDb from appsettings.json,
      # swapping localhost for the compose service name.
      ConnectionStrings__OrdersDb: "Server=sqlserver,1433;Database=PacklyOrders;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Packly!Local1};TrustServerCertificate=True"
      ConnectionStrings__ReadModel: "mongodb://${MONGO_USER:-packly}:${MONGO_PASSWORD:-packly}@mongo:27017/PacklyRead?authSource=admin"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-packly}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-packly}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      # The aspnet runtime image ships no curl, wget or nc, and adding one for a
      # single probe is not worth the layer. bash is there, and /dev/tcp speaks
      # enough HTTP to ask /health whether both databases are answering. $$ escapes
      # to a literal $ so the shell expands it, not Compose.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/8080 && printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && read -r status <&3 && [[ $$status == *"200 OK"* ]]'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      # Waits for the health checks rather than merely for the containers to
      # exist, so the migration on startup finds a database that can answer and
      # the outbox has a broker to deliver to.
      sqlserver:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Owns the order saga: the only service that decides what happens next, and the
  # only publisher of OrderStatusChanged.
  orchestrator:
    build:
      context: .
      dockerfile: src/Packly.Orchestrator/Dockerfile
    container_name: packly-orchestrator
    environment:
      # Its own database. Saga state belongs to the orchestrator, not to whoever
      # happens to share a server with it.
      ConnectionStrings__OrderStateDb: "Server=sqlserver,1433;Database=PacklyOrderState;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Packly!Local1};TrustServerCertificate=True"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-packly}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-packly}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Simulated payment gateway. Stateless: it answers one command and holds
  # nothing, so it needs neither a database nor an outbox.
  payment:
    build:
      context: .
      dockerfile: src/Packly.Payment/Dockerfile
    container_name: packly-payment
    environment:
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-packly}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-packly}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Simulated warehouse: reserves stock, then packs. Stateless like payment.
  inventory:
    build:
      context: .
      dockerfile: src/Packly.Inventory/Dockerfile
    container_name: packly-inventory
    environment:
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-packly}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-packly}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Subscribes to order status changes and "emails" the customer on outcomes.
  # Nothing sends to it and nothing waits for it: stopping this service leaves
  # orders processing exactly as before, minus the mail.
  notification:
    build:
      context: .
      dockerfile: src/Packly.Notification/Dockerfile
    container_name: packly-notification
    environment:
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-packly}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-packly}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Builds the read model. The only writer of the query side, and the second
  # independent subscriber to the same status events the notification service
  # receives.
  projection:
    build:
      context: .
      dockerfile: src/Packly.Projection/Dockerfile
    container_name: packly-projection
    environment:
      # authSource=admin because the credentials belong to the root user, which
      # lives in admin rather than in the database being addressed.
      ConnectionStrings__ReadModel: "mongodb://${MONGO_USER:-packly}:${MONGO_PASSWORD:-packly}@mongo:27017/PacklyRead?authSource=admin"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-packly}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-packly}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq-data:
  sqlserver-data:
  mongo-data:
