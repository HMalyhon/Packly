name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Reads the repository and nothing more: this workflow publishes no package,
# pushes no commit, and comments on no pull request.
permissions:
  contents: read

# A second push supersedes the first, so an abandoned commit stops burning a
# runner halfway through six image builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # Reads global.json rather than naming a version here, so CI cannot drift
      # onto a different SDK from the one the repository asks for.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # setup-dotnet's own cache wants a lock file, which this repository does
      # not carry. Central package management means every version this restore
      # resolves is written in these two files, so they are the key.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # Warnings are already errors in Directory.Build.props, so there is no
      # flag here: what fails in CI fails locally, for the same reason. What
      # this adds is the clean tree - an incremental build skips the projects
      # it believes unchanged, and a violation inside one stays quiet until
      # somebody builds from scratch.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # No containers and no services. The saga tests run against an in-memory
      # bus and saga repository, so what is under test here needs only the SDK.
      - name: Test
        run: dotnet test --no-build --configuration Release

  # The README's first instruction is `docker compose up --build`, and nothing
  # checked it. Every Dockerfile hand-maintains its own list of COPY lines for
  # the project files it restores; add a project reference without adding the
  # COPY beside it and the SDK build above still passes while the documented
  # command fails for everyone who clones the repository.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Compose doubles as a bake definition, so the six buildable services are
      # built through buildx and their layers survive between runs. Without it
      # each run restored six times from scratch, which is exactly the work the
      # Dockerfiles are layered to avoid.
      - name: Build images
        uses: docker/bake-action@v7
        with:
          files: docker-compose.yml
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

  # The images job proves the six images build. This proves that what they come
  # up as actually processes an order - which is the claim the README opens with,
  # and the one a badge saying "CI passing" is read as covering.
  #
  # `up --build` rather than the images the job above cached, because the point is
  # to run the documented command as written rather than a faster equivalent.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: docker compose up --build
        run: docker compose up -d --build

      - name: Wait for the API to report healthy
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "the API never reported healthy"
          exit 1

      # All three endings, because the two failures are where the saga earns its
      # name: one stops, the other compensates first.
      - name: Follow an order down each path
        run: |
          set -uo pipefail

          order() { # label sku name quantity price expected
            local id status=""
            id=$(curl -fsS -X POST http://localhost:8080/api/orders \
                  -H 'content-type: application/json' \
                  -d "{\"customerId\":\"ci\",\"items\":[{\"sku\":\"$2\",\"name\":\"$3\",\"quantity\":$4,\"unitPrice\":$5}]}" \
                 | python3 -c 'import sys,json;print(json.load(sys.stdin)["orderId"])')

            for _ in $(seq 1 60); do
              status=$(curl -fsS "http://localhost:8080/api/orders/$id" 2>/dev/null \
                       | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)
              case "$status" in Completed|Rejected|Cancelled) break;; esac
              sleep 2
            done

            if [ "$status" != "$6" ]; then
              echo "FAIL $1: expected $6, got ${status:-nothing} (order $id)"
              return 1
            fi
            echo "ok   $1 -> $status"
          }

          order "happy path" MUG-1      Mug   2 4.50   Completed || exit 1
          order "declined"   CHAIR-1    Chair 2 600.00 Rejected  || exit 1
          order "sold out"   SOLD-OUT-1 Vinyl 1 42.00  Cancelled || exit 1

      - name: Service logs
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
